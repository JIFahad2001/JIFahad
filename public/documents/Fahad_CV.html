<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional CV Generator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#111827',
                            950: '#030712'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- html2pdf.js for high quality PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- React and Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .font-serif-cv {
            font-family: 'Merriweather', Georgia, serif;
        }

        /* Standard A4 Paper Document Styling */
        .cv-paper {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff !important;
            color: #000000 !important;
            margin: 0 auto;
            padding: 20mm 18mm;
            box-sizing: border-box;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* CSS Print Engine Overrides */
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print, nav, header, button {
                display: none !important;
            }
            body * {
                visibility: hidden;
            }
            #printable-cv, #printable-cv * {
                visibility: visible;
            }
            #printable-cv {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                margin: 0 !important;
                padding: 12mm 15mm !important;
                box-shadow: none !important;
            }
            @page {
                size: A4;
                margin: 10mm;
            }
        }

        /* Webkit scrollbar polish */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DEGREE_OPTIONS = [
            "Secondary School Certificate", "Higher Secondary Certificate", "Secondary School Certificate (BOU)", "Higher Secondary Certificate (BOU)", 
            "Bachelors (Hons.)", "Bachelors (Pass)", "Masters", 
            "PhD", "M.Phil"
        ];

        const GROUP_OPTIONS = ["Science", "Business Studies", "Arts"];
        const BOARD_OPTIONS = [
            "Dhaka", "Rajshahi", "Cumilla (Comilla)", "Jashore (Jessore)", 
            "Chattogram (Chittagong)", "Barishal (Barisal)", "Sylhet", 
            "Dinajpur", "Mymensingh"
        ];

        const PUBLICATION_TYPES = ["Article", "Research", "Case Study"];

        const SAMPLE_DATA = {
            personal: {
                fullName: "Ayesha Rahman",
                nationality: "Bangladeshi",
                dob: "1997-08-14",
                cell: "+880 1712 345678",
                email: "ayesha.rahman@example.com",
                presentAddress: "House 42, Road 11, Block D, Banani, Dhaka-1213, Bangladesh"
            },
            education: [
                {
                    id: 1,
                    degree: "Masters",
                    group: "",
                    major: "Computer Science & Engineering",
                    topic: "",
                    duration: "1.5 Years",
                    board: "",
                    institute: "University of Dhaka",
                    result: "3.85",
                    scale: "4"
                },
                {
                    id: 2,
                    degree: "Bachelors (Hons.)",
                    group: "",
                    major: "Software Engineering",
                    topic: "",
                    duration: "4 Years",
                    board: "",
                    institute: "BRAC University",
                    result: "3.78",
                    scale: "4"
                }
            ],
            trainings: [
                {
                    id: 1,
                    theme: "Advanced Web Application Security & Cloud Architecture",
                    provider: "Institute of Information Technology (IIT)",
                    duration: "3 Months (120 Hours)"
                }
            ],
            experiences: [
                {
                    id: 1,
                    type: "Permanent",
                    designation: "Senior Full Stack Software Engineer",
                    startDate: "2022-03-01",
                    endDate: "",
                    company: "TechNexus Innovations Ltd."
                }
            ],
            publications: [
                {
                    id: 1,
                    type: "Research",
                    title: "Optimization of Microservices Architecture using Distributed Caching Strategies",
                    doi: "10.1109/TSE.2023.3289102",
                    year: "2023"
                }
            ],
            extracurricular: [
                {
                    id: 1,
                    title: "President & Lead Organizer",
                    organization: "BRAC University Computer Club",
                    startDate: "2022-01-01",
                    endDate: "2023-12-31",
                    description: "Organized annual national hackathons with over 500+ participants and managed tech workshops."
                },
                {
                    id: 2,
                    title: "Youth Technology Mentor",
                    organization: "CoderDojo Bangladesh",
                    startDate: "2021-05-01",
                    endDate: "2022-02-01",
                    description: "Mentored high school students in basic programming, algorithmic thinking, and web development."
                },
                {
                    id: 3,
                    title: "Table Tennis Team Captain",
                    organization: "Inter-University Departmental Sports League",
                    startDate: "2019-09-01",
                    endDate: "2021-04-01",
                    description: "Led university departmental table tennis team in inter-university championships."
                }
            ],
            references: [
                {
                    id: 1,
                    name: "Dr. Mahmudul Hasan",
                    designation: "Professor & Department Head",
                    institute: "Department of CSE, University of Dhaka",
                    email: "mhasan@du.ac.bd"
                }
            ]
        };

        function App() {
            const [darkMode, setDarkMode] = useState(false);
            const cvPaperRef = useRef(null);
            const [personal, setPersonal] = useState({
                fullName: '', nationality: '', dob: '', cell: '', email: '', presentAddress: ''
            });

            const [education, setEducation] = useState([]);
            const [trainings, setTrainings] = useState([]);
            const [experiences, setExperiences] = useState([]);
            const [publications, setPublications] = useState([]);
            const [extracurricular, setExtracurricular] = useState([]);
            const [references, setReferences] = useState([]);

            const [activeTab, setActiveTab] = useState('personal');
            const [showLatexModal, setShowLatexModal] = useState(false);
            const [latexCode, setLatexCode] = useState('');
            const [copied, setCopied] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [errors, setErrors] = useState({});
            const [mobilePreview, setMobilePreview] = useState(false);

            useEffect(() => {
                // Check local theme or system preference
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    setDarkMode(true);
                }
                loadSampleData();
            }, []);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const loadSampleData = () => {
                setPersonal(SAMPLE_DATA.personal);
                setEducation(SAMPLE_DATA.education);
                setTrainings(SAMPLE_DATA.trainings);
                setExperiences(SAMPLE_DATA.experiences);
                setPublications(SAMPLE_DATA.publications);
                setExtracurricular(SAMPLE_DATA.extracurricular);
                setReferences(SAMPLE_DATA.references);
                setErrors({});
            };

            const clearAll = () => {
                setPersonal({ fullName: '', nationality: '', dob: '', cell: '', email: '', presentAddress: '' });
                setEducation([]);
                setTrainings([]);
                setExperiences([]);
                setPublications([]);
                setExtracurricular([]);
                setReferences([]);
                setErrors({});
            };

            const handlePersonalChange = (e) => {
                const { name, value } = e.target;
                setPersonal(prev => ({ ...prev, [name]: value }));
                if (errors[name]) setErrors(prev => ({ ...prev, [name]: null }));
            };

            const validate = () => {
                let errs = {};
                if (!personal.fullName.trim()) errs.fullName = "Full Name is required";
                if (!personal.email.trim()) errs.email = "Email address is required";
                else if (!/\S+@\S+\.\S+/.test(personal.email)) errs.email = "Invalid email format";
                if (!personal.cell.trim()) errs.cell = "Contact phone number is required";

                setErrors(errs);
                return Object.keys(errs).length === 0;
            };

            const sortChronologically = (items) => {
                return [...items].sort((a, b) => {
                    const getComparableDate = (item) => {
                        if (item.startDate) return new Date(item.startDate).getTime();
                        if (item.endDate) return new Date(item.endDate).getTime();
                        if (item.year) return new Date(`${item.year}-01-01`).getTime();
                        return 0;
                    };
                    return getComparableDate(b) - getComparableDate(a); // Most recent first
                });
            };

            const handleSortExtracurricular = () => {
                setExtracurricular(prev => sortChronologically(prev));
            };

            // Extracurricular Handlers (No Categories, Unclassified)
            const addExtracurricular = () => {
                setExtracurricular(prev => [
                    ...prev,
                    { id: Date.now(), title: '', organization: '', startDate: '', endDate: '', description: '' }
                ]);
            };
            const updateExtracurricular = (id, field, value) => {
                setExtracurricular(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            };
            const removeExtracurricular = (id) => {
                setExtracurricular(prev => prev.filter(item => item.id !== id));
            };

            // Publications Handlers
            const addPublication = () => {
                setPublications(prev => [
                    ...prev,
                    { id: Date.now(), type: 'Research', title: '', doi: '', year: new Date().getFullYear().toString() }
                ]);
            };
            const updatePublication = (id, field, value) => {
                setPublications(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            };
            const removePublication = (id) => {
                setPublications(prev => prev.filter(item => item.id !== id));
            };

            // Education Handlers
            const addEducation = () => {
                setEducation(prev => [
                    ...prev,
                    { id: Date.now(), degree: "SSC", group: "Science", major: "", topic: "", duration: "", board: "Dhaka", institute: "", result: "", scale: "5" }
                ]);
            };
            const updateEducation = (id, field, value) => {
                setEducation(prev => prev.map(item => {
                    if (item.id === id) {
                        const updated = { ...item, [field]: value };
                        if (field === 'degree') {
                            const deg = value;
                            const isSscHsc = ["SSC", "HSC", "SSC (BOU)", "HSC (BOU)"].includes(deg);
                            const isHigher = ["Bachelors (Hons.)", "Bachelors (Pass)", "Masters"].includes(deg);
                            const isResearch = ["PhD", "M.Phil"].includes(deg);

                            if (isSscHsc) {
                                updated.group = updated.group || "Science";
                                updated.board = updated.board || "Dhaka";
                                updated.scale = "5";
                                updated.major = "";
                                updated.topic = "";
                            } else if (isHigher) {
                                updated.group = "";
                                updated.board = "";
                                updated.scale = "4";
                                updated.topic = "";
                            } else if (isResearch) {
                                updated.group = "";
                                updated.board = "";
                                updated.result = "";
                                updated.scale = "";
                                updated.major = "";
                            }
                        }
                        return updated;
                    }
                    return item;
                }));
            };
            const removeEducation = (id) => {
                setEducation(prev => prev.filter(item => item.id !== id));
            };

            // Training Handlers
            const addTraining = () => {
                setTrainings(prev => [...prev, { id: Date.now(), theme: '', provider: '', duration: '' }]);
            };
            const updateTraining = (id, field, value) => {
                setTrainings(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            };
            const removeTraining = (id) => {
                setTrainings(prev => prev.filter(item => item.id !== id));
            };

            // Experience Handlers
            const addExperience = () => {
                setExperiences(prev => [...prev, { id: Date.now(), type: 'Permanent', designation: '', startDate: '', endDate: '', company: '' }]);
            };
            const updateExperience = (id, field, value) => {
                setExperiences(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            };
            const removeExperience = (id) => {
                setExperiences(prev => prev.filter(item => item.id !== id));
            };

            // Reference Handlers
            const addReference = () => {
                setReferences(prev => [...prev, { id: Date.now(), name: '', designation: '', institute: '', email: '' }]);
            };
            const updateReference = (id, field, value) => {
                setReferences(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            };
            const removeReference = (id) => {
                setReferences(prev => prev.filter(item => item.id !== id));
            };

            const escapeLatex = (str) => {
                if (!str) return '';
                return str
                    .replace(/\\/g, '\\textbackslash{}')
                    .replace(/&/g, '\\&')
                    .replace(/%/g, '\\%')
                    .replace(/\$/g, '\\$')
                    .replace(/#/g, '\\#')
                    .replace(/_/g, '\\_')
                    .replace(/\{/g, '\\{')
                    .replace(/\}/g, '\\}');
            };

            const generateLaTeX = () => {
                if (!validate()) {
                    alert("Please fill out required personal details (Name, Email, Cell) before generating LaTeX.");
                    return;
                }

                const sortedExtra = sortChronologically(extracurricular);

                let code = `\\documentclass[11pt,a4paper]{article}
\\usepackage[margin=0.75in]{geometry}
\\usepackage{hyperref}
\\usepackage{enumitem}
\\usepackage{titlesec}

\\hypersetup{hidelinks}
\\titleformat{\\section}{\\large\\bfseries\\uppercase}{}{0em}{}[\\titlerule]
\\titlespacing*{\\section}{0pt}{12pt}{6pt}
\\pagestyle{empty}

\\begin{document}

% Personal Information
\\begin{center}
    {\\LARGE \\bfseries ${escapeLatex(personal.fullName)}}\\\\ \\vspace{4pt}
    ${personal.presentAddress ? escapeLatex(personal.presentAddress) + ' \\\\' : ''}
    ${personal.cell ? 'Cell: ' + escapeLatex(personal.cell) + ' \\mid ' : ''} Email: \\href{mailto:${escapeLatex(personal.email)}}{${escapeLatex(personal.email)}}\\\\
    ${personal.nationality ? 'Nationality: ' + escapeLatex(personal.nationality) + ' \\mid ' : ''} ${personal.dob ? 'DOB: ' + escapeLatex(personal.dob) : ''}
\\end{center}
\\vspace{-8pt}
`;

                if (education.length > 0) {
                    code += `\n\\section{Educational Background}\n`;
                    education.forEach(edu => {
                        const detailList = [];
                        if (edu.group) detailList.push(`Group: ${escapeLatex(edu.group)}`);
                        if (edu.major) detailList.push(`Major: ${escapeLatex(edu.major)}`);
                        if (edu.topic) detailList.push(`Topic: ${escapeLatex(edu.topic)}`);
                        if (edu.board) detailList.push(`Board: ${escapeLatex(edu.board)}`);
                        if (edu.duration) detailList.push(`Duration: ${escapeLatex(edu.duration)}`);
                        if (edu.result) detailList.push(`Result: ${escapeLatex(edu.result)}${edu.scale ? ' (Scale ' + escapeLatex(edu.scale) + ')' : ''}`);

                        code += `\\noindent\\textbf{${escapeLatex(edu.degree)}} -- ${escapeLatex(edu.institute)}\\\\
${detailList.length > 0 ? '\\small{' + detailList.join(' \\mid ') + '}\\\\' : ''}
\\vspace{4pt}\n`;
                    });
                }

                if (experiences.length > 0) {
                    code += `\n\\section{Work Experience}\n`;
                    experiences.forEach(exp => {
                        const endStr = exp.endDate ? escapeLatex(exp.endDate) : 'Present';
                        code += `\\noindent\\textbf{${escapeLatex(exp.designation)}} \\hfill ${escapeLatex(exp.startDate)} -- ${endStr}\\\\
\\textit{${escapeLatex(exp.company)}} \\hfill \\small{Type: ${escapeLatex(exp.type)}}\\\\
\\vspace{4pt}\n`;
                    });
                }

                if (publications.length > 0) {
                    code += `\n\\section{Publications}\n`;
                    publications.forEach(pub => {
                        code += `\\noindent\\textbf{[${escapeLatex(pub.type)}] ${escapeLatex(pub.title)}}\\\\
${pub.doi ? '\\small{DOI: \\url{https://doi.org/' + escapeLatex(pub.doi) + '}}' : ''} ${pub.year ? '\\hfill \\small{' + escapeLatex(pub.year) + '}' : ''}\\\\
\\vspace{4pt}\n`;
                    });
                }

                if (trainings.length > 0) {
                    code += `\n\\section{Trainings \\& Certifications}\n`;
                    trainings.forEach(tr => {
                        code += `\\noindent\\textbf{${escapeLatex(tr.theme)}}\\\\
\\textit{${escapeLatex(tr.provider)}} \\hfill \\small{Duration: ${escapeLatex(tr.duration)}}\\\\
\\vspace{4pt}\n`;
                    });
                }

                if (sortedExtra.length > 0) {
                    code += `\n\\section{Extracurricular Activities}\n`;
                    sortedExtra.forEach(ec => {
                        const dateStr = ec.startDate || ec.endDate ? `${escapeLatex(ec.startDate)} -- ${ec.endDate ? escapeLatex(ec.endDate) : 'Present'}` : '';
                        code += `\\noindent\\textbf{${escapeLatex(ec.title)}} \\hfill \\small{${dateStr}}\\\\
${ec.organization ? '\\textit{' + escapeLatex(ec.organization) + '}\\\\' : ''}
${ec.description ? '\\small{' + escapeLatex(ec.description) + '}\\\\' : ''}
\\vspace{4pt}\n`;
                    });
                }

                if (references.length > 0) {
                    code += `\n\\section{References}\n`;
                    references.forEach(ref => {
                        code += `\\noindent\\textbf{${escapeLatex(ref.name)}}\\\\
${escapeLatex(ref.designation)}, ${escapeLatex(ref.institute)}\\\\
Email: \\href{mailto:${escapeLatex(ref.email)}}{${escapeLatex(ref.email)}}\\\\
\\vspace{4pt}\n`;
                    });
                }

                code += `\n\\end{document}`;

                setLatexCode(code);
                setShowLatexModal(true);
            };

            const copyLatexToClipboard = () => {
                const textarea = document.createElement("textarea");
                textarea.value = latexCode;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                setCopied(true);
                setTimeout(() => setCopied(false), 2500);
            };

            const downloadLatexFile = () => {
                const element = document.createElement("a");
                const file = new Blob([latexCode], { type: 'text/plain' });
                element.href = URL.createObjectURL(file);
                element.download = `${(personal.fullName || 'CV').replace(/\s+/g, '_')}_CV.tex`;
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
            };

            const downloadPDF = async () => {
                if (!validate()) {
                    alert("Please fill out required personal fields before downloading PDF.");
                    return;
                }

                const source = cvPaperRef.current || document.getElementById('printable-cv');
                if (!source) return;

                setIsExporting(true);

                // Build isolated clone container off-screen to prevent layout cutoffs
                const container = document.createElement('div');
                container.style.position = 'fixed';
                container.style.left = '-9999px';
                container.style.top = '0';
                container.style.width = '210mm';
                container.style.background = '#ffffff';
                container.style.color = '#000000';
                container.style.zIndex = '-9999';

                const clone = source.cloneNode(true);
                clone.style.width = '210mm';
                clone.style.margin = '0';
                clone.style.boxShadow = 'none';
                clone.style.padding = '20mm 18mm';
                clone.style.background = '#ffffff';

                container.appendChild(clone);
                document.body.appendChild(container);

                const fileName = `${(personal.fullName || 'Curriculum_Vitae').replace(/\s+/g, '_')}_CV.pdf`;

                const opt = {
                    margin:       0,
                    filename:     fileName,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { 
                        scale: 2, 
                        useCORS: true, 
                        logging: false, 
                        scrollY: 0,
                        scrollX: 0,
                        backgroundColor: '#ffffff'
                    },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                try {
                    if (window.html2pdf) {
                        await window.html2pdf().set(opt).from(clone).save();
                    } else {
                        window.print();
                    }
                } catch (err) {
                    console.error("PDF export error:", err);
                    window.print();
                } finally {
                    document.body.removeChild(container);
                    setIsExporting(false);
                }
            };

            const handlePrint = () => {
                if (!validate()) {
                    alert("Please fill out required personal fields before printing.");
                    return;
                }
                window.print();
            };

            const sortedExtracurricularList = sortChronologically(extracurricular);

            return (
                <div className="min-h-screen flex flex-col transition-colors duration-200">
                    
                    {}
                    <header className="no-print bg-slate-900 dark:bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-indigo-600 p-2 rounded-lg text-white">
                                    <i className="fa-solid fa-file-contract text-xl"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold tracking-tight">ProCV Builder</h1>
                                    <p className="text-xs text-slate-400">Academic & Professional CV Generator</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-2">
                                {/* Theme Switcher Button */}
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="p-2 rounded-md bg-slate-800 hover:bg-slate-700 text-amber-400 dark:text-sky-300 transition"
                                    title="Toggle Light / Dark Mode"
                                >
                                    <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-sky-200'} text-sm`}></i>
                                </button>

                                <button 
                                    onClick={loadSampleData} 
                                    className="hidden sm:inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 transition"
                                >
                                    <i className="fa-solid fa-wand-magic-sparkles mr-1.5 text-amber-400"></i> Sample
                                </button>
                                <button 
                                    onClick={clearAll} 
                                    className="hidden sm:inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
                                >
                                    <i className="fa-solid fa-rotate-left mr-1.5"></i> Clear
                                </button>
                                <button 
                                    onClick={generateLaTeX} 
                                    className="inline-flex items-center px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md bg-teal-600 hover:bg-teal-500 text-white transition shadow-sm"
                                >
                                    <i className="fa-solid fa-code mr-1.5"></i> LaTeX
                                </button>
                                <button 
                                    onClick={downloadPDF} 
                                    disabled={isExporting}
                                    className="inline-flex items-center px-3.5 py-1.5 text-xs sm:text-sm font-semibold rounded-md bg-emerald-600 hover:bg-emerald-500 text-white transition shadow-sm"
                                >
                                    <i className={`fa-solid ${isExporting ? 'fa-spinner fa-spin' : 'fa-file-pdf'} mr-1.5`}></i> 
                                    {isExporting ? 'Exporting...' : 'Download PDF'}
                                </button>

                                                            {edu.degree} {edu.major ? `in ${edu.major}` : ''}
                                                        </span>
                                                        <span className="text-black font-normal">
                                                            {edu.institute}
                                                        </span>
                                                    </div>

                                                    <div className="text-black mt-1 flex flex-wrap gap-x-3 gap-y-0.5 text-[11px]">
                                                        {edu.group && <span><strong>Group:</strong> {edu.group}</span>}
                                                        {edu.topic && <span><strong>Research Topic:</strong> {edu.topic}</span>}
                                                        {edu.board && <span><strong>Board:</strong> {edu.board}</span>}
                                                        {edu.duration && <span><strong>Duration:</strong> {edu.duration}</span>}
                                                        {edu.result && (
                                                            <span>
                                                                <strong>Result:</strong> {edu.result} {edu.scale ? `(Out of ${edu.scale})` : ''}
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Work Experience */}
                                {experiences.length > 0 && (
                                    <div className="mb-5">
                                        <h2 className="text-xs font-bold uppercase tracking-widest text-black border-b border-black pb-1 mb-3">
                                            Work Experience
                                        </h2>
                                        <div className="space-y-3">
                                            {experiences.map(exp => (
                                                <div key={exp.id} className="text-xs">
                                                    <div className="flex justify-between font-bold text-black">
                                                        <span>{exp.designation || 'Designation Name'}</span>
                                                        <span className="text-black font-normal">
                                                            {exp.startDate ? `${exp.startDate} – ` : ''}{exp.endDate || 'Present'}
                                                        </span>
                                                    </div>
                                                    <div className="flex justify-between text-black italic mt-0.5">
                                                        <span>{exp.company || 'Company Name'}</span>
                                                        <span className="not-italic text-black">[{exp.type}]</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Publications */}
                                {publications.length > 0 && (
                                    <div className="mb-5">
                                        <h2 className="text-xs font-bold uppercase tracking-widest text-black border-b border-black pb-1 mb-3">
                                            Publications
                                        </h2>
                                        <div className="space-y-2.5">
                                            {publications.map(pub => (
                                                <div key={pub.id} className="text-xs">
                                                    <div className="flex justify-between text-black">
                                                        <span className="font-semibold">
                                                            <span className="font-bold">[{pub.type}]</span> {pub.title || 'Publication Title'}
                                                        </span>
                                                        {pub.year && <span className="text-black text-[11px] font-medium ml-2">{pub.year}</span>}
                                                    </div>
                                                    {pub.doi && (
                                                        <div className="text-black text-[11px] font-mono mt-0.5">
                                                            DOI: <a href={`https://doi.org/${pub.doi}`} target="_blank" rel="noreferrer" className="underline">{pub.doi}</a>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Trainings & Certificates */}
                                {trainings.length > 0 && (
                                    <div className="mb-5">
                                        <h2 className="text-xs font-bold uppercase tracking-widest text-black border-b border-black pb-1 mb-3">
                                            Trainings & Certificates
                                        </h2>
                                        <div className="space-y-2.5">
                                            {trainings.map(tr => (
                                                <div key={tr.id} className="text-xs">
                                                    <div className="flex justify-between font-semibold text-black">
                                                        <span>{tr.theme || 'Training Theme'}</span>
                                                        {tr.duration && <span className="font-normal text-black">{tr.duration}</span>}
                                                    </div>
                                                    {tr.provider && <div className="text-black text-[11px] italic">{tr.provider}</div>}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Extra-Curricular Activities (Unclassified & Chronologically Arranged) */}
                                {sortedExtracurricularList.length > 0 && (
                                    <div className="mb-5">
                                        <h2 className="text-xs font-bold uppercase tracking-widest text-black border-b border-black pb-1 mb-3">
                                            Extra-Curricular Activities
                                        </h2>
                                        <div className="space-y-3">
                                            {sortedExtracurricularList.map(ec => (
                                                <div key={ec.id} className="text-xs">
                                                    {/* Line 1: Title & Dates */}
                                                    <div className="flex justify-between font-bold text-black">
                                                        <span>{ec.title || 'Activity Title'}</span>
                                                        {(ec.startDate || ec.endDate) && (
                                                            <span className="font-normal text-black text-[11px]">
                                                                {ec.startDate ? `${ec.startDate} – ` : ''}{ec.endDate || 'Present'}
                                                            </span>
                                                        )}
                                                    </div>
                                                    
                                                    {/* Line 2: Organization (Starts on Next Line) */}
                                                    {ec.organization && (
                                                        <div className="text-black italic mt-0.5">
                                                            {ec.organization}
                                                        </div>
                                                    )}
                                                    
                                                    {/* Line 3: Description (Starts on Next Line) */}
                                                    {ec.description && (
                                                        <div className="text-black text-[11px] mt-0.5 leading-relaxed">
                                                            {ec.description}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* References */}
                                {references.length > 0 && (
                                    <div className="mb-5">
                                        <h2 className="text-xs font-bold uppercase tracking-widest text-black border-b border-black pb-1 mb-3">
                                            References
                                        </h2>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            {references.map(ref => (
                                                <div key={ref.id} className="text-xs space-y-0.5">
                                                    <p className="font-bold text-black">{ref.name || 'Referee Name'}</p>
                                                    <p className="text-black">{ref.designation}</p>
                                                    <p className="text-black text-[11px]">{ref.institute}</p>
                                                    {ref.email && <p className="text-black text-[11px]"><i className="fa-solid fa-envelope mr-1 text-gray-600"></i>{ref.email}</p>}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                            </div>
                        </div>

                    </main>

                    {}
                    {showLatexModal && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-900 rounded-2xl max-w-3xl w-full p-6 shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="flex items-center justify-between border-b dark:border-slate-800 pb-4 mb-4">
                                    <div className="flex items-center space-x-2">
                                        <i className="fa-solid fa-code text-teal-600 dark:text-teal-400 text-lg"></i>
                                        <h3 className="text-lg font-bold text-slate-800 dark:text-slate-100">Generated LaTeX Source Code</h3>
                                    </div>
                                    <button 
                                        onClick={() => setShowLatexModal(false)}
                                        className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 rounded-lg p-1"
                                    >
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                <p className="text-xs text-gray-500 dark:text-slate-400 mb-3">
                                    Copy and paste this code into Overleaf or any LaTeX compiler to render a professional PDF CV.
                                </p>

                                <div className="relative flex-1 overflow-hidden bg-slate-950 rounded-xl p-4 font-mono text-xs text-emerald-400 border border-slate-800">
                                    <textarea 
                                        readOnly 
                                        value={latexCode}
                                        className="w-full h-full bg-transparent border-none outline-none resize-none text-emerald-400 font-mono text-xs"
                                    ></textarea>
                                </div>

                                <div className="mt-4 flex justify-between items-center pt-2">
                                    <span className="text-xs text-gray-500">
                                        {copied ? <span className="text-emerald-600 dark:text-emerald-400 font-semibold"><i className="fa-solid fa-circle-check mr-1"></i> Copied to clipboard!</span> : ''}
                                    </span>
                                    <div className="flex space-x-2">
                                        <button 
                                            onClick={copyLatexToClipboard}
                                            className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold transition flex items-center"
                                        >
                                            <i className="fa-regular fa-copy mr-1.5"></i> Copy Code
                                        </button>
                                        <button 
                                            onClick={downloadLatexFile}
                                            className="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-lg text-xs font-semibold transition flex items-center"
                                        >
                                            <i className="fa-solid fa-download mr-1.5"></i> Download .tex File
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
